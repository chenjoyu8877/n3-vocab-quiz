<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N3 單字高手 Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="setup-section">
            <h1>N3 日文單字測驗</h1>
            <div class="control-group">
                <label>出題形式：</label>
                <select id="qType">
                    <option value="中文意思">中文意思</option>
                    <option value="漢字">漢字</option>
                    <option value="audio">聽力出題 (Audio)</option>
                </select>
            </div>
            <div class="control-group">
                <label>答題形式：</label>
                <select id="aType">
                    <option value="漢字">漢字回答</option>
                    <option value="假名拼音">假名回答</option>
                    <option value="flip">翻卡模式 (不打字)</option>
                </select>
            </div>
            <button id="start-btn" class="primary-btn">開始測驗</button>
        </div>

        <div id="quiz-section" class="hidden">
            <div class="header-row">
                <button id="home-btn">⬅ 回首頁</button>
            </div>
            
            <div id="question-area">
                <h2 id="question-display">載入中...</h2>
                <button id="play-audio-btn" class="hidden">🔊 重播單字</button>
            </div>

            <div id="input-area">
                <input type="text" id="answer-input" placeholder="輸入答案..." autocomplete="off">
                <button id="submit-btn">送出答案</button>
            </div>

            <div id="flashcard-area" class="hidden">
                <div id="flashcard">
                    <div class="card-face card-front">點擊查看答案</div>
                    <div class="card-face card-back" id="flashcard-answer"></div>
                </div>
            </div>

            <p id="feedback"></p>
            <button id="next-btn" class="hidden">下一題 ➔</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
