<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N3 單字高手 Pro - 終極自訂版</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        
        <div id="setup-section">
            <h1>N3 日文單字測驗</h1>
            
            <div class="control-group">
                <label for="qType">出題形式：</label>
                <select id="qType">
                    <option value="audio">聽力出題 (Audio)</option>
                    <option value="漢字">漢字出題</option>
                    <option value="中文意思">中文意思出題</option>
                    <option value="sentence">例句填空模式</option>
                    <option value="mixed" style="color: #ea580c; font-weight: bold;">🌪️ 混合考題大亂鬥</option>
                </select>
            </div>

            <div class="control-group" id="aType-container" style="background: #f8f9fa; padding: 12px; border-radius: 12px; border: 1px solid #e1e8ed;">
                </div>

            <div class="advanced-settings">
                <div class="toggle-group" style="margin-bottom: 5px;">
                    <label class="switch">
                        <input type="checkbox" id="srs-toggle" checked>
                        <span class="slider"></span>
                    </label>
                    <span style="font-weight: bold; color: #2c3e50;">啟用 SRS 智慧複習 (紀錄進度)</span>
                </div>
                <p style="font-size: 11px; color: #7f8c8d; margin-top: 0; margin-bottom: 15px; padding-left: 56px;">開啟: 每日30新字+舊字複習；關閉: 隨機全庫無盡抽題。</p>

                <div class="toggle-group" style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px;">
                    <label class="switch">
                        <input type="checkbox" id="ai-toggle">
                        <span class="slider"></span>
                    </label>
                    <span style="color: #007bff; font-weight: bold;">開啟 Gemini AI 語意批改</span>
                </div>
                <div id="ai-settings" class="hidden" style="margin-bottom: 15px;">
                    <p style="font-size: 12px; color: #666; margin-bottom: 5px;">⚠️ 啟用後將強制進行測驗，結束後統一交由 AI 對答案(需包含中文作答)。</p>
                    <input type="password" id="gemini-api-key" placeholder="請輸入 Gemini API Key..." autocomplete="off">
                </div>
                
                <div class="stats-container">
                    <h3 style="font-size: 16px; margin-bottom: 10px; color: #444;">📊 弱點分析 (最常錯單字)</h3>
                    <canvas id="errorChart" width="400" height="250"></canvas>
                </div>

                <button id="view-list-btn" class="secondary-btn" style="background-color: #28a745; width: 100%; margin-bottom: 10px; color: white; border: none;">📖 瀏覽單字表</button>
                <button id="reset-data-btn" class="danger-btn">Sweep 🧹 重設所有單字進度 (歸零)</button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <button id="start-new-words-btn" class="primary-btn" style="margin: 0; padding: 18px; font-size: 18px; background: #20c997; box-shadow: 0 4px 12px rgba(32,201,151,0.3);">🆕 專屬：今日 30 個新單字</button>
                <button id="start-btn" class="primary-btn" style="margin: 0; padding: 18px; font-size: 18px;">🚀 綜合：新單字 ＋ 舊複習</button>
                <button id="start-frequent-mistakes-btn" class="primary-btn" style="margin: 0; background: #6c757d; box-shadow: 0 4px 12px rgba(108,117,125,0.3);">💀 常錯單字死穴特訓</button>
            </div>
        </div>

        <div id="quiz-section" class="hidden">
            <div class="header-row">
                <button id="home-btn">⬅ 回首頁</button>
            </div>
            
            <div id="question-area">
                <div id="question-display-container">
                    <h2 id="question-display">載入中...</h2>
                </div>
                
                <div id="hint-display"></div>
                
                <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;">
                    <button id="play-audio-btn" class="secondary-btn hidden" style="margin:0; flex: 1;">🔊 重播語音</button>
                </div>
            </div>

            <div id="input-area" class="hidden">
                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                    <input type="text" id="kanji-input" placeholder="請輸入漢字..." autocomplete="off">
                    <input type="text" id="kana-input" placeholder="請輸入假名拼音..." autocomplete="off">
                    <input type="text" id="chinese-input" placeholder="請輸入中文意思..." autocomplete="off">
                </div>
                <button id="submit-btn" class="primary-btn">送出答案</button>
            </div>

            <div id="canvas-area" class="hidden" style="text-align: center;">
                <p style="font-size: 14px; color: #555; margin-bottom: 5px;">請在下方區域手寫單字：</p>
                <canvas id="hw-canvas" width="320" height="240"></canvas>
                <div style="margin-top: 10px;">
                    <button onclick="clearCanvas()" class="secondary-btn" style="display: inline-block; width: auto; padding: 10px 20px;">清除畫板</button>
                    <button id="canvas-submit-btn" class="primary-btn" style="display: inline-block; width: auto; padding: 10px 30px;" onclick="checkAnswer()">我寫好了 (查看答案卡)</button>
                </div>
            </div>

            <div id="flashcard-area" class="hidden">
                <div id="flashcard" onclick="checkAnswer()">
                    <div class="card-face">點擊此處 / 按 Enter 查看完整單字卡</div>
                </div>
            </div>

            <div id="feedback"></div>
            <button id="next-btn" class="primary-btn hidden">下一題 ➔</button>
        </div>

        <div id="batch-results-area" class="hidden">
            <h2 style="color: #2c3e50; margin-bottom: 10px;">📊 測驗結算 (AI 批改)</h2>
            <div id="batch-results-content" style="text-align: left; margin-bottom: 15px;"></div>
            <button id="batch-finish-btn" class="primary-btn">完成並回首頁</button>
        </div>

        <div id="list-section" class="hidden">
            <div class="header-row">
                <button onclick="closeListView()" id="home-btn-list">⬅ 回首頁</button>
            </div>
            <h2 style="margin-top: 10px; color: #2c3e50;">全單字列表</h2>

            <div class="control-group" style="margin-top: 15px; margin-bottom: 5px;">
                <input type="text" id="search-input" placeholder="🔍 搜尋漢字、假名或中文..." autocomplete="off">
            </div>

            <div class="control-group" style="margin-top: 5px; text-align: left; display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label style="font-size: 12px; color: #666;">大類：</label>
                    <select id="main-category-filter" onchange="updateSubCategories()">
                        <option value="all">全部</option>
                        <option value="名詞">名詞</option>
                        <option value="動詞">動詞</option>
                        <option value="形容詞">形容詞</option>
                        <option value="副詞">副詞</option> 
                        <option value="慣用">慣用</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 12px; color: #666;">小類：</label>
                    <select id="pos-filter" onchange="renderVocabList()">
                        <option value="all">全部</option>
                    </select>
                </div>
            </div>

            <div id="vocab-list-container"></div>
        </div>

    </div> 

    <div id="word-modal" class="hidden">
        <div class="modal-card">
            <div id="modal-content"></div>
        </div>
    </div>

    <div id="round-modal" class="hidden">
        <div class="modal-card" style="text-align: center;">
            <h2 style="color: #28a745; margin-bottom: 10px;">🎉 恭喜過關！</h2>
            <p style="color: #555; margin-bottom: 25px;">本輪單字已全數消滅！<br>你要重新挑戰這一輪，還是結束任務？</p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button onclick="restartRound()" class="primary-btn" style="margin:0;">🔄 重新進行這一輪 (不限次數)</button>
                <button onclick="document.getElementById('home-btn').click(); document.getElementById('round-modal').classList.add('hidden');" class="secondary-btn">🏠 結束並回首頁</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
